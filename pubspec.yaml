name: lab
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  
  excel: ^4.0.6
  path_provider: ^2.1.5
  share_plus: ^10.0.2
  pdf: ^3.11.0
  printing: ^5.11.0
  shared_preferences: ^2.2.2  
  intl: ^0.18.1

 
  image_picker: ^1.1.2
  path: ^1.9.0
  
 
  sqflite: ^2.3.0     
  crypto: ^3.0.3       
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/